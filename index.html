<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>NZES Warden App</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
:root {
  color-scheme: light;
  font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(180deg, #edf2ff 0%, #f8fafc 45%, #ffffff 100%);
  color: #0f172a;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background: radial-gradient(circle at top, #eef2ff 0%, #f9fafb 55%, #ffffff 100%);
}

.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px;
  display: grid;
  gap: 20px;
  min-height: 100%;
}

.app__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 40%, #4f46e5 100%);
  padding: 20px 24px;
  border-radius: 20px;
  box-shadow: 0 20px 45px rgba(30, 64, 175, 0.35);
  color: #f8fafc;
}

.eyebrow {
  margin: 0 0 6px;
  text-transform: uppercase;
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  color: rgba(255, 255, 255, 0.7);
}

h1 {
  margin: 0;
  font-size: 1.6rem;
}

.status {
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.85rem;
  box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
}

.panel {
  background: #ffffff;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
  display: grid;
  gap: 16px;
  border: 1px solid rgba(226, 232, 240, 0.8);
}

.panel__header h2 {
  margin: 0 0 6px;
  font-size: 1.3rem;
  color: #111827;
}

.panel__header p {
  margin: 0;
  color: #475569;
}

.panel__footer {
  display: flex;
  justify-content: flex-end;
}

.settings {
  display: grid;
  gap: 12px;
}

.settings label {
  display: grid;
  gap: 6px;
  font-weight: 600;
  color: #334155;
}

.settings input {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid #cbd5f5;
  font-size: 0.95rem;
}

.map-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.map-actions .helper {
  margin: 0;
}

.map {
  height: clamp(280px, 45vh, 430px);
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  background: #dbeafe;
  border: 1px solid rgba(148, 163, 184, 0.3);
  box-shadow: inset 0 0 30px rgba(59, 130, 246, 0.15);
}

.map__fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #1e3a8a;
  font-weight: 600;
  z-index: 0;
}

.primary,
.secondary {
  border: none;
  border-radius: 999px;
  padding: 12px 22px;
  font-weight: 600;
  cursor: pointer;
  font-size: 1rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.primary {
  background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 55%, #3b82f6 100%);
  color: #ffffff;
  box-shadow: 0 14px 30px rgba(37, 99, 235, 0.35);
}

.primary:hover,
.secondary:hover {
  transform: translateY(-1px);
  box-shadow: 0 16px 32px rgba(15, 23, 42, 0.18);
}

.secondary {
  background: #eef2ff;
  color: #1e293b;
  box-shadow: inset 0 0 0 1px rgba(99, 102, 241, 0.18);
}

.hidden {
  display: none;
}

.capture {
  display: grid;
  gap: 12px;
}

.capture input[type="file"] {
  width: 100%;
}

.capture__frame {
  position: relative;
  height: 280px;
  border-radius: 18px;
  border: 2px dashed rgba(59, 130, 246, 0.6);
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #f8fbff 0%, #eef2ff 100%);
  overflow: hidden;
}

.capture__frame img,
.capture__frame video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.capture__frame.camera-active video {
  display: block;
}

.capture__frame.photo-captured img {
  display: block;
}

.guide {
  position: absolute;
  width: 70%;
  height: 30%;
  border: 3px solid #f59e0b;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: #78350f;
  font-weight: 600;
  background: rgba(254, 243, 199, 0.45);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.guide__label {
  font-size: 0.85rem;
}

.helper {
  font-size: 0.9rem;
  color: #475569;
}

.plate-confirm {
  display: grid;
  gap: 8px;
  padding: 16px;
  border-radius: 16px;
  background: #f1f5ff;
  border: 1px solid rgba(59, 130, 246, 0.2);
}

.plate-confirm input {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid #cbd5f5;
  font-size: 1rem;
}

.reason {
  display: grid;
  gap: 12px;
}

.reason label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  color: #334155;
}

.reason textarea {
  min-height: 100px;
  border-radius: 14px;
  padding: 12px;
  border: 1px solid #cbd5f5;
  font-family: inherit;
}

.review {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.review__photos {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
}

.review__photos img {
  width: 100%;
  border-radius: 12px;
  object-fit: cover;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
}

.review__details {
  display: grid;
  gap: 12px;
}

.review__details ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 8px;
  color: #334155;
}

.notice {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  padding: 16px;
  display: grid;
  gap: 12px;
}

.notice__header {
  text-align: center;
}

.notice__header h3 {
  margin: 0;
  color: #0f172a;
}

.notice__header p {
  margin: 4px 0 0;
  color: #475569;
}

.notice__body p {
  margin: 6px 0;
}

.notice__qr {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  text-align: center;
}

.notice__qr canvas {
  background: #fff;
  padding: 8px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
}

.attach {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

@media (max-width: 720px) {
  .app {
    padding: 16px;
    gap: 16px;
  }

  .app__header {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .panel {
    padding: 16px;
  }

  .panel__footer {
    justify-content: stretch;
  }

  .primary,
  .secondary {
    width: 100%;
    justify-content: center;
  }

  .map {
    height: 45vh;
  }

  .notice {
    padding: 12px;
  }
}

    </style>
    <link rel="stylesheet" href="styles.css" />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script type="text/babel" src="app.js"></script>
  </body>
</html>
